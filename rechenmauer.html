<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧱 Rechenmauer</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --card-hover: #1e2d45;
    --accent: #14b8a6;
    --accent-glow: rgba(20, 184, 166, 0.3);
    --text: #f0f0f0;
    --text-dim: #a0a0b8;
    --correct: #34d399;
    --wrong: #f87171;

    --mortar: #cfc6b8;
    --mortar-dark: #a99f90;
    --gap: 7px;
    --bw: clamp(78px, calc((100vw - 110px) / 3), 124px);
    --bh: calc(var(--bw) * 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 45% 30%, rgba(20, 184, 166, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 55% 70%, rgba(200, 85, 61, 0.07) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: var(--surface);
    color: var(--text-dim);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.2s ease;
  }
  .back-btn:hover { background: var(--card-hover); color: var(--text); }

  .container {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 70px 20px 80px;
    text-align: center;
  }

  .dn { display: none !important; }

  /* ---------- Start ---------- */
  #start-screen { animation: fadeUp 0.6s ease; }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    margin: 18px 0 8px;
    background: linear-gradient(135deg, #e07a5f, #f2a65a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 1.05rem;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .btn-start, .btn-primary {
    background: linear-gradient(135deg, var(--accent), #2dd4bf);
    border: none;
    border-radius: 16px;
    padding: 16px 48px;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-start:hover, .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 24px var(--accent-glow); }
  .btn-start:active, .btn-primary:active { transform: scale(0.95); }

  /* ---------- Fortschritt ---------- */
  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .progress-text, .score-display {
    font-family: 'Fredoka', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .progress-text { color: var(--text-dim); }
  .score-display { color: var(--accent); }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #2dd4bf);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* ---------- Baustelle ---------- */
  .site {
    background: linear-gradient(180deg, #1d2b4a 0%, #223559 70%, #2a3f63 100%);
    border-radius: 22px;
    padding: 30px 12px 0;
    border: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
    position: relative;
  }

  .hint {
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  .wall {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap);
    position: relative;
    z-index: 1;
  }

  .row {
    display: flex;
    justify-content: center;
    gap: var(--gap);
  }

  /* Ziegelstein */
  .brick {
    --h: 12;
    --l: 46%;
    width: var(--bw);
    height: var(--bh);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: calc(var(--bh) * 0.56);
    font-weight: 700;
    color: #fff8f0;
    text-shadow: 0 2px 0 rgba(70, 20, 10, 0.55);
    position: relative;
    background-color: hsl(var(--h) 55% var(--l));
    background-image:
      radial-gradient(rgba(60, 15, 5, 0.22) 1px, transparent 1.6px),
      radial-gradient(rgba(255, 230, 210, 0.13) 1px, transparent 1.6px),
      linear-gradient(180deg, rgba(255,255,255,0.10), rgba(0,0,0,0.18));
    background-size: 9px 8px, 13px 11px, 100% 100%;
    background-position: 0 0, 5px 4px, 0 0;
    box-shadow:
      0 0 0 var(--gap) var(--mortar),
      inset 0 2px 0 rgba(255, 220, 200, 0.28),
      inset 0 -4px 0 rgba(60, 15, 5, 0.28),
      inset 3px 0 0 rgba(255, 220, 200, 0.08),
      inset -3px 0 0 rgba(60, 15, 5, 0.15);
    animation: brickIn 0.45s cubic-bezier(.2,.9,.3,1.25) both;
  }

  /* Loch in der Mauer */
  .brick.hole {
    background: #0f1626;
    box-shadow:
      0 0 0 var(--gap) var(--mortar),
      inset 0 6px 14px rgba(0,0,0,0.85),
      inset 0 -2px 6px rgba(0,0,0,0.5);
    color: var(--accent);
    text-shadow: 0 0 14px var(--accent-glow);
  }
  .brick.hole span { animation: pulse 1.4s ease-in-out infinite; }

  .brick.placed { animation: brickDrop 0.5s cubic-bezier(.3,1.4,.5,1) both; }
  .brick.placed.correct {
    box-shadow:
      0 0 0 var(--gap) var(--mortar),
      0 0 0 calc(var(--gap) + 3px) var(--correct),
      0 0 22px 6px rgba(52, 211, 153, 0.45),
      inset 0 2px 0 rgba(255, 220, 200, 0.28),
      inset 0 -4px 0 rgba(60, 15, 5, 0.28);
    z-index: 2;
  }
  .brick.placed.wrong {
    box-shadow:
      0 0 0 var(--gap) var(--mortar),
      0 0 0 calc(var(--gap) + 3px) var(--wrong),
      inset 0 2px 0 rgba(255, 220, 200, 0.28),
      inset 0 -4px 0 rgba(60, 15, 5, 0.28);
    z-index: 2;
  }
  .wall.shake { animation: shakeX 0.45s ease; }

  /* Boden */
  .ground {
    margin: calc(var(--gap) + 2px) -12px 0;
    height: 34px;
    background:
      linear-gradient(180deg, #4ade80 0, #22a35a 7px, #6b4a2f 7px, #5a3d26 100%);
    position: relative;
  }
  .ground::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 12px; bottom: 0;
    background: radial-gradient(rgba(0,0,0,0.18) 1.5px, transparent 2px) 0 0 / 11px 9px;
  }

  /* ---------- Eingabe ---------- */
  .input-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin-top: 24px;
  }

  #answer-input {
    width: 110px;
    padding: 12px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    border: 2px solid var(--accent);
    border-radius: 14px;
    background: rgba(20, 184, 166, 0.1);
    color: var(--text);
    text-align: center;
    -moz-appearance: textfield;
  }
  #answer-input::-webkit-outer-spin-button,
  #answer-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #answer-input:focus {
    outline: none;
    border-color: var(--correct);
    box-shadow: 0 0 14px rgba(52, 211, 153, 0.3);
  }

  .btn-submit {
    background: linear-gradient(135deg, var(--accent), #2dd4bf);
    border: none;
    border-radius: 14px;
    padding: 14px 26px;
    color: white;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
  .btn-submit:active { transform: scale(0.95); }
  .btn-submit:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  .feedback {
    margin-top: 16px;
    min-height: 1.6em;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .feedback.show { opacity: 1; }
  .feedback.is-correct { color: var(--correct); }
  .feedback.is-wrong { color: var(--wrong); }

  /* ---------- Ergebnis ---------- */
  #result-screen { animation: fadeUp 0.6s ease; }
  .result-emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 12px;
    animation: bounce 2s ease infinite;
  }
  .result-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #f2a65a;
  }
  .result-score { color: var(--text-dim); font-size: 1.1rem; margin-bottom: 28px; }
  .btn-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .btn-primary { min-width: 220px; padding: 16px 32px; }
  .btn-secondary {
    background: var(--surface);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 14px 32px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 220px;
  }
  .btn-secondary:hover { background: var(--card-hover); border-color: var(--accent); }
  .btn-secondary:active { transform: scale(0.95); }

  /* Kleine Beispielmauer auf dem Startbildschirm */
  .demo { --bw: 64px; --bh: 32px; --gap: 5px; display: inline-flex; margin-top: 24px; }
  .demo .brick { font-size: 1.05rem; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.9); } }
  @keyframes brickIn {
    from { opacity: 0; transform: translateY(-36px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes brickDrop {
    0%   { transform: translateY(-60px) scale(1.08); }
    70%  { transform: translateY(4px) scale(1); }
    100% { transform: translateY(0); }
  }
  @keyframes shakeX {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  @media (max-width: 400px) {
    .container { padding: 64px 14px 60px; }
    :root { --gap: 6px; }
  }
</style>
</head>
<body>

<a class="back-btn" href="index.html">&larr; Zurück</a>

<div class="container">
  <div id="start-screen">
    <div class="wall demo" id="demo-wall"></div>
    <h1>Rechenmauer</h1>
    <p class="subtitle">Zwei Steine nebeneinander ergeben zusammen den Stein darüber. Finde die fehlende Zahl!</p>
    <button class="btn-start" onclick="startGame()">Spiel starten</button>
  </div>

  <div id="game-screen" class="dn">
    <div class="progress-bar-wrap">
      <span class="progress-text" id="progress-text">1 / 10</span>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:10%"></div></div>
      <span class="score-display" id="score-display">⭐ 0</span>
    </div>

    <div class="site">
      <div class="hint">Welcher Stein fehlt?</div>
      <div class="wall" id="wall"></div>
      <div class="ground"></div>
    </div>

    <div class="input-row">
      <input type="number" id="answer-input" inputmode="numeric" pattern="[0-9]*" placeholder="?" autocomplete="off">
      <button class="btn-submit" id="submit-btn" onclick="submitAnswer()">✓</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div id="result-screen" class="dn">
    <span class="result-emoji" id="result-emoji">🏆</span>
    <div class="result-title" id="result-title">Super!</div>
    <div class="result-score" id="result-score"></div>
    <div class="btn-group">
      <button class="btn-primary" onclick="startGame()">Nochmal spielen</button>
      <button class="btn-secondary" onclick="showScreen(startScreen)">Hauptmenü</button>
    </div>
  </div>
</div>

<script>
var ROUNDS = 10;
var current, score, answered, wall;

var startScreen = document.getElementById("start-screen");
var gameScreen = document.getElementById("game-screen");
var resultScreen = document.getElementById("result-screen");
var progressText = document.getElementById("progress-text");
var progressFill = document.getElementById("progress-fill");
var scoreDisplay = document.getElementById("score-display");
var wallEl = document.getElementById("wall");
var answerInput = document.getElementById("answer-input");
var submitBtn = document.getElementById("submit-btn");
var feedback = document.getElementById("feedback");

// Steine: 0,1,2 = unten · 3 = 0+1, 4 = 1+2 (Mitte) · 5 = 3+4 (Spitze)
// Reihen von oben nach unten, so wie sie auf dem Bildschirm stehen.
var ROWS = [[5], [3, 4], [0, 1, 2]];

function showScreen(screen) {
  [startScreen, gameScreen, resultScreen].forEach(function(s) { s.classList.add("dn"); });
  screen.classList.remove("dn");
}

function rand(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

function generateWall() {
  var a = rand(1, 9), b = rand(1, 9), c = rand(1, 9);
  var s = [a, b, c, a + b, b + c, a + b + b + c];
  var blank = rand(0, 5);
  return { stones: s, blank: blank, answer: s[blank] };
}

// Zeichnet eine Mauer von unten nach oben (Animation startet unten)
function buildWall(target, stones, blank) {
  target.innerHTML = "";
  ROWS.forEach(function(row, r) {
    var rowEl = document.createElement("div");
    rowEl.className = "row";
    row.forEach(function(idx, i) {
      var b = document.createElement("div");
      b.className = "brick";
      b.dataset.idx = idx;
      b.style.setProperty("--h", rand(6, 16));
      b.style.setProperty("--l", rand(40, 50) + "%");
      // untere Reihe zuerst, dann Stein für Stein nach oben
      var order = (ROWS.length - 1 - r) * 3 + i;
      b.style.animationDelay = (order * 70) + "ms";
      if (idx === blank) {
        b.classList.add("hole");
        b.innerHTML = "<span>?</span>";
      } else {
        b.textContent = stones[idx];
      }
      rowEl.appendChild(b);
    });
    target.appendChild(rowEl);
  });
}

function startGame() {
  current = 0;
  score = 0;
  showScreen(gameScreen);
  renderRound();
}

function renderRound() {
  answered = false;
  feedback.className = "feedback";
  feedback.textContent = "";
  answerInput.value = "";
  answerInput.disabled = false;
  submitBtn.disabled = false;

  wall = generateWall();
  wallEl.classList.remove("shake");
  buildWall(wallEl, wall.stones, wall.blank);

  progressText.textContent = (current + 1) + " / " + ROUNDS;
  progressFill.style.width = (((current + 1) / ROUNDS) * 100) + "%";
  scoreDisplay.textContent = "⭐ " + score;

  answerInput.focus();
}

function submitAnswer() {
  if (answered) return;

  var userAnswer = parseInt(answerInput.value, 10);
  if (isNaN(userAnswer)) {
    feedback.className = "feedback show is-wrong";
    feedback.textContent = "Bitte eine Zahl eingeben!";
    answerInput.focus();
    return;
  }

  answered = true;
  answerInput.disabled = true;
  submitBtn.disabled = true;

  var isCorrect = userAnswer === wall.answer;
  var old = wallEl.querySelector('.brick[data-idx="' + wall.blank + '"]');

  // Neuen Ziegel einsetzen (frisches Element, damit die Animation sauber startet)
  var brick = document.createElement("div");
  brick.className = "brick placed " + (isCorrect ? "correct" : "wrong");
  brick.dataset.idx = wall.blank;
  brick.style.setProperty("--h", 12);
  brick.style.setProperty("--l", "46%");
  brick.textContent = wall.answer;
  old.parentNode.replaceChild(brick, old);

  if (isCorrect) {
    score++;
    scoreDisplay.textContent = "⭐ " + score;
    feedback.className = "feedback show is-correct";
    feedback.textContent = "✓ Richtig, der Stein passt!";
  } else {
    void wallEl.offsetWidth;
    wallEl.classList.add("shake");
    feedback.className = "feedback show is-wrong";
    feedback.textContent = "✗ Du hast " + userAnswer + " geschrieben – richtig ist " + wall.answer + ".";
  }

  setTimeout(function() {
    current++;
    if (current < ROUNDS) renderRound();
    else showResults();
  }, isCorrect ? 1400 : 2600);
}

answerInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") submitAnswer();
});

function showResults() {
  showScreen(resultScreen);
  var pct = Math.round((score / ROUNDS) * 100);
  var trophy, title;
  if (pct === 100) { trophy = "🏆"; title = "Perfekt gemauert!"; }
  else if (pct >= 80) { trophy = "🌟"; title = "Super gemacht!"; }
  else if (pct >= 60) { trophy = "👏"; title = "Gut gemacht!"; }
  else { trophy = "💪"; title = "Weiter üben!"; }
  document.getElementById("result-emoji").textContent = trophy;
  document.getElementById("result-title").textContent = title;
  document.getElementById("result-score").innerHTML = "Du hast <strong>" + score + " von " + ROUNDS + "</strong> Steinen richtig gesetzt";
}

// Beispielmauer auf dem Startbildschirm: 3, 4, 2 → 7, 6 → 13
buildWall(document.getElementById("demo-wall"), [3, 4, 2, 7, 6, 13], -1);
</script>
</body>
</html>
